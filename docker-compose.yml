name: gocomet-bidding

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidding
      POSTGRES_PASSWORD: bidding
      POSTGRES_DB: bidding
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidding -d bidding"]
      interval: 3s
      timeout: 3s
      retries: 20


  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20


volumes:
  pgdata: