name: gocomet-bidding-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidding
      POSTGRES_PASSWORD: bidding
      POSTGRES_DB: bidding
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidding -d bidding"]
      interval: 3s
      timeout: 3s
      retries: 20


  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://bidding:bidding@postgres:5432/bidding
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    profiles: ["frontend"]
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  api-tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    volumes:
      - .:/app
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://bidding:bidding@postgres:5432/bidding_test
      TEST_REDIS_URL: redis://redis:6379/15
      ENABLE_CLOSER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
